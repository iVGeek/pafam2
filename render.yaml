# Render blueprint for pafam2 (Next.js + PostgreSQL).
# Docs: https://render.com/docs/blueprint-spec
#
# Plans below are placeholders — adjust to the account's available plans in the
# Render dashboard. The free web plan spins down after inactivity.
services:
  - type: web
    name: pafam2
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    # Apply committed migrations, then start the Node.js server.
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pafam2-db
          property: connectionString
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production

databases:
  - name: pafam2-db
    plan: free
    databaseName: pafam2
    user: pafam2
